name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-check:
    # The MetaTrader5 package is Windows-only, so CI only checks that every template compiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all templates
        run: python -m compileall -q templates
